name: Keep API Alive

on:
  schedule:
    - cron: "0 12 1-7,15-21 * 0"

  workflow_dispatch:

jobs:
  ping-api:
    runs-on: self-hosted

    steps:
      - name: Check runner
        run: |
          echo "Runner is online"
          hostname
          date

      - name: Ping Chroma Garcia API
        run: |
          curl --fail --silent --show-error \
            https://chroma-garcia-api.fly.dev/api/artists