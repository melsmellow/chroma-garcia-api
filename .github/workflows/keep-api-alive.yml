name: Keep API Alive

on:
  schedule:
    # Runs every other Sunday at 12:00 UTC
    - cron: "0 12 1-7,15-21 * 0"

  workflow_dispatch:

jobs:
  ping-api:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Chroma Garcia API
        run: |
          curl --fail --silent --show-error \
            https://chroma-garcia-api.fly.dev/api/artists
